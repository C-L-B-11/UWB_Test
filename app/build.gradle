plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.uwb_test'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.uwb_test"
        minSdk 37
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        viewBinding true
    }
    compileSdkMinor 1
}

dependencies {
    implementation("com.google.android.gms:play-services-nearby:19.0.0")
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.6'
    implementation 'androidx.navigation:navigation-ui:2.9.7'
    implementation 'androidx.core:core-ktx:'
    implementation "androidx.core.uwb:uwb:1.0.0-rc01"
    implementation 'androidx.databinding:compiler:3.2.0-alpha11'
    implementation 'com.google.android.things:androidthings:1.0'
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:3.0.7'
    implementation 'androidx.core:core-i18n:1.0.0'
    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.8.0")
    implementation 'com.google.firebase:protolite-well-known-types:18.0.1'
    implementation 'androidx.media3:media3-common-ktx:1.10.1'
    implementation 'com.google.firebase:firebase-sessions:3.0.6'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}